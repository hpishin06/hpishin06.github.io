<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>۷ مستطیل</title>
<style>
body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#0d0d0d;font-family:sans-serif;color:#fff}
.container{position:relative;width:100%;max-width:420px;height:260px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.strip{position:absolute;width:100px;height:180px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:24px;font-weight:700;color:#111;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.strip span{pointer-events:none}
#play{margin-top:20px;padding:14px 20px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:linear-gradient(90deg,#ffd700,#ff9f00);cursor:pointer;box-shadow:0 6px 18px rgba(255,215,0,0.2)}
.result{margin-top:16px;font-size:18px;font-weight:700}
.good{color:#10b981}
.bad{color:#ef4444}
</style>
</head>
<body>
<div>
  <div class="container" id="cont"></div>
  <button id="play">شروع</button>
  <div id="out" class="result"></div>
</div>
<script>
const cont=document.getElementById("cont");
const out=document.getElementById("out");
const items=["پوکه","پر","پوکه","پوکه","پر","پوکه","پر"];
let strips=[];
function createStrips(){
  cont.innerHTML="";
  strips=[];
  items.forEach((t,i)=>{
    let d=document.createElement("div");
    d.className="strip";
    d.style.left=(i*110-110*3)+"px";
    d.style.background=t==="پر"?"linear-gradient(180deg,#ffd700,#ff9f00)":"#ccc";
    d.innerHTML="<span>"+t+"</span>";
    cont.appendChild(d);
    strips.push(d);
  });
}
createStrips();
document.getElementById("play").addEventListener("click",()=>{
  out.textContent="";
  let stopIndex=Math.floor(Math.random()*items.length);
  strips.forEach((d,i)=>{
    d.style.transition="transform 1s cubic-bezier(.2,.8,.2,1)";
    d.style.transform="translateX("+( (3-stopIndex)*110 )+"px)";
  });
  setTimeout(()=>{
    const res=items[stopIndex];
    out.textContent=res==="پر"?"شلیک شد ⚠️":"خالی 🎉";
    out.className="result "+(res==="پر"?"bad":"good");
  },1000);
});
</script>
</body>
</html>
