<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>۷ مستطیل</title>
<style>
body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#0d0d0d;font-family:sans-serif;color:#fff}
.wrap{text-align:center}
.container{position:relative;width:100%;max-width:700px;height:200px;overflow:hidden;margin:auto}
.strip{position:absolute;top:0;width:100px;height:200px;display:flex;align-items:center;justify-content:center;border-radius:16px;font-size:26px;font-weight:700;color:#111;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.strip span{pointer-events:none}
button{margin-top:20px;padding:14px 24px;font-size:16px;font-weight:700;border:0;border-radius:14px;background:linear-gradient(90deg,#ffd700,#ff9f00);cursor:pointer;box-shadow:0 6px 20px rgba(255,215,0,0.3)}
.result{margin-top:18px;font-size:20px;font-weight:800}
.good{color:#10b981}
.bad{color:#ef4444}
</style>
</head>
<body>
<div class="wrap">
  <div class="container" id="cont"></div>
  <button id="play">شروع</button>
  <div id="out" class="result"></div>
</div>
<script>
const cont=document.getElementById("cont");
const out=document.getElementById("out");
const items=["پوکه","پر","پوکه","پر","پوکه","پر","پوکه"];
let strips=[];
function createStrips(){
  cont.innerHTML="";
  strips=[];
  items.forEach((t,i)=>{
    let d=document.createElement("div");
    d.className="strip";
    d.style.left=(i*120)+"px";
    d.style.background=t==="پر"?"linear-gradient(180deg,#ffd700,#ff9f00)":"#ccc";
    d.innerHTML="<span>"+t+"</span>";
    cont.appendChild(d);
    strips.push(d);
  });
}
createStrips();

document.getElementById("play").addEventListener("click",()=>{
  out.textContent="";
  let stopIndex=Math.floor(Math.random()*items.length);
  let offset= (cont.clientWidth/2 -50) - (stopIndex*120);
  strips.forEach((d,i)=>{
    d.style.transition="transform 1s ease-in-out";
    d.style.transform="translateX("+offset+"px)";
  });
  setTimeout(()=>{
    const res=items[stopIndex];
    out.textContent=res==="پر"?"پر شد ⚠️":"پوکه 🎉";
    out.className="result "+(res==="پر"?"bad":"good");
  },1000);
});
</script>
</body>
</html>
