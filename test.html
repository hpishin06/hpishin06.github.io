<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Cat Dash — Endless (Math-Fair)</title>
<style>
  :root{
    --bg1:#0f1422; --bg2:#151c2c; --ground:#2e3750;
    --cat:#ffd6e8; --cat2:#ce91b5; --warn:#ed6a5a; --saw:#b9c6ff;
  }
  html,body{height:100%;margin:0;background:var(--bg1);color:#e9edf6;font-family:system-ui,Segoe UI,Roboto,Inter,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  #wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  canvas{width:min(100vw, 980px);height:min(100dvh - 72px, 560px);background:linear-gradient(var(--bg1),var(--bg2));border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #hud{width:min(100vw, 980px);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 6px}
  .pill{background:#ffffff12;border:1px solid #ffffff25;border-radius:999px;padding:6px 10px;font-size:13px}
  #btns{display:flex;gap:8px;align-items:center}
  button{border:0;border-radius:999px;padding:8px 12px;font-weight:700}
  .ghost{background:#ffffff18;color:#fff}
  .accent{background:#ffd166;color:#222}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="980" height="560" aria-label="Cat Dash Endless Fair"></canvas>
  <div id="hud">
    <div class="pill">امتیاز: <b id="score">0</b> • رکورد: <b id="best">0</b> • سرعت: <b id="spd">1.00×</b></div>
    <div id="btns">
      <button id="pause" class="ghost">توقف (P)</button>
      <button id="restart" class="ghost">ری‌استارت (R)</button>
      <button id="jump" class="accent">پرش</button>
    </div>
  </div>
</div>

<script>
(()=>{"use strict";

/* ===== Physics & Tuning (units: px, s) ===== */
const GRID=20, PHYS_DT=1/60;
const g = 2400;        // gravity
const v0 = 900;        // initial jump velocity
const FLOOR_Y = 420;

const CAT={w:26,h:26,x:120}; // کمی کوچکتر برای تلورانس
const BASE_SPEED=140;        // آهسته‌تر
const MAX_SPEED = 300;
const SPEED_RAMP = 0.005;    // رشد آرام‌تر

/* Human factors (safety) */
const REACT_MS = 180;        // واکنش انسان + تأخیر تاچ/کیبورد
const LAND_RECOVER_MS = 220; // فاصله امن بین فرود تا مانع بعدی
const SAFETY = 0.78;         // ضریب اطمینان روی برد پرش (~22% حاشیه)

/* Forgiveness (hitbox) */
const FORGIVE_PX = 4;  // جمع‌کردن Hitbox موانع
const SPIKE_INSET = 5; // مثلث‌ها حاشیه‌ی بیشتری می‌گیرن

/* ===== Canvas/DOM ===== */
const cvs=document.getElementById("game"), ctx=cvs.getContext("2d");
const scoreEl=document.getElementById("score"), bestEl=document.getElementById("best"), spdEl=document.getElementById("spd");
const btnJump=document.getElementById("jump"), btnPause=document.getElementById("pause"), btnRestart=document.getElementById("restart");
const dpr=Math.min(2,window.devicePixelRatio||1);
function resize(){const w=cvs.clientWidth,h=cvs.clientHeight;cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
new ResizeObserver(resize).observe(cvs); resize();

/* ===== Game State ===== */
let paused=false, acc=0, last=performance.now(), tAll=0, deaths=0, streak=0;
let scrollX=0, speed=BASE_SPEED, score=0, best=0;
const player={x:CAT.x,y:FLOOR_Y-CAT.h,vy:0,grounded:true,coyoteMs:100,bufMs:0,wantJump:false,alive:true,ang:0};

const ents={spikes:[], gaps:[], plats:[], saws:[], stars:[]};

/* ===== Math helpers ===== */
// total flight time landing same height: t=2*v0/g
function flightTimeSame(){ return 2*v0/g; }
// horizontal range at current speed for same-height landing
function maxRange(vx){ return vx * flightTimeSame() * SAFETY; }
// max climbable height: v0^2 >= 2 g dy  => dy_max = v0^2/(2g)
function maxRise(){ return (v0*v0)/(2*g) * SAFETY; }
// time to reach a platform dy higher (ascending root)
function timeToDyUp(dy){ const D=v0*v0 - 2*g*dy; if(D<=0) return null; return (v0 - Math.sqrt(D))/g; }
// time to land dy lower (descending root)
function timeToDyDown(dyNeg){ const D=v0*v0 - 2*g*dyNeg; return (v0 + Math.sqrt(D))/g; }

/* ===== Input ===== */
function requestJump(){ player.wantJump=true; player.bufMs = 120; }
btnJump.addEventListener("pointerdown",e=>{e.preventDefault();requestJump();});
cvs.addEventListener("pointerdown",e=>{e.preventDefault();requestJump();},{passive:false});
window.addEventListener("keydown",e=>{
  if(["Space","ArrowUp","KeyW"].includes(e.code)){e.preventDefault();requestJump();}
  if(e.code==="KeyP"){e.preventDefault(); paused=!paused;}
  if(e.code==="KeyR"){e.preventDefault(); restart();}
});
btnPause.addEventListener("click",()=>paused=!paused);
btnRestart.addEventListener("click",()=>restart());

/* ===== Fair Chunk Generator ===== */
let nextGenAt = 200; // world x where we must ensure next chunk is prepared

function fairConstraints(vx){
  const react = vx * (REACT_MS/1000);           // فاصله‌ی لازم برای دیدن و واکنش
  const recover = vx * (LAND_RECOVER_MS/1000);  // فاصله‌ی امن بعد از فرود
  const Rmax = maxRange(vx);
  const Hmax = maxRise();
  return {react, recover, Rmax, Hmax};
}

/* Each chunk picks a pattern but clamps widths/heights to constraints. */
function genChunk(){
  const vx = speed;
  const C = fairConstraints(vx);

  const startX = scrollX + cvs.width/dpr + randRange(80,160);
  const len = randInt(26,34)*GRID;
  const endX = startX + len;

  const pattern = choice(["easy_mix","spikes_fair","gaps_fair","platform_steps","saws_fair","combo_fair","easy_mix","easy_mix"]);

  if(pattern==="gaps_fair"){
    // Gap width <= Rmax - react, و لبه‌ی قبل/بعد فاصله‌ی recover دارند
    let x = startX + C.react + 30;
    while(x < endX - C.react - 40){
      const w = clamp(randRange(GRID*1.0, C.Rmax - C.react - 20), GRID*1.0, GRID*4.5);
      ents.gaps.push({x, w});
      // ستون‌های نشان‌دهنده‌ی لبه (اختیاری نمایشی)
      x += w + clamp(randRange(C.recover*0.6, C.recover*1.2), 70, 200);
      if(rand()<0.35) ents.stars.push({x: x-20, y:FLOOR_Y - GRID*2.6});
    }
  } else if(pattern==="spikes_fair"){
    let x = startX + C.react + 20;
    while(x < endX - 40){
      const n = choice([1,1,2,2,3]); // خوش‌خیم‌تر
      ents.spikes.push({x, n});
      x += clamp(randRange(C.recover*0.7, C.recover*1.5), 80, 190);
    }
  } else if(pattern==="platform_steps"){
    // پله‌هایی که ارتفاع‌شون از Hmax عبور نکنه
    let x = startX + C.react + 20;
    while(x < endX - 40){
      const up = clamp(randRange(GRID*1.0, C.Hmax*0.9), GRID*1.0, GRID*3.0);
      const y = FLOOR_Y - GRID*2 - up; // بالاتر از زمین
      const w = GRID * choice([2,3,4]);
      ents.plats.push({x, y, w});
      x += w + clamp(randRange(C.recover*0.6, C.recover*1.2), 80, 200);
    }
  } else if(pattern==="saws_fair"){
    let x = startX + C.react + 40;
    while(x < endX - 60){
      const amp = choice([24,36]); // دامنه‌ی ملایم
      ents.saws.push({x, y:FLOOR_Y - GRID*2, r:12, amp, t:rand()*Math.PI*2});
      x += clamp(randRange(C.recover*0.8, C.recover*1.4), 100, 200);
    }
  } else if(pattern==="combo_fair"){
    let x=startX + C.react + 20;
    while(x < endX - 60){
      const pick = choice(["sp","gp","pf"]);
      if(pick==="sp"){
        const n = choice([1,2]); // در کامبو، خوش‌خیم‌تر
        ents.spikes.push({x, n}); x += clamp(randRange(C.recover*0.7, C.recover*1.1), 90, 170);
      } else if(pick==="gp"){
        const w = clamp(randRange(GRID*1.0, C.Rmax - C.react - 30), GRID*1.0, GRID*4.0);
        ents.gaps.push({x, w}); x += w + clamp(randRange(C.recover*0.6, C.recover*1.0), 90, 160);
      } else {
        const up = clamp(randRange(GRID*1.0, C.Hmax*0.8), GRID*1.0, GRID*2.5);
        ents.plats.push({x, y:FLOOR_Y - GRID*2 - up, w:GRID*choice([2,3])});
        x += clamp(randRange(C.recover*0.7, C.recover*1.1), 90, 170);
      }
      if(rand()<0.25) ents.stars.push({x:x-16, y:FLOOR_Y - GRID*2.6});
    }
  } else { // easy_mix
    let x=startX + C.react + 20;
    while(x < endX - 60){
      const pick = choice(["sp","gp","pf","-","-"]); // بیشتر فضاهای خالی
      if(pick==="sp"){ ents.spikes.push({x, n:1}); x += clamp(randRange(C.recover*0.8, C.recover*1.3), 100, 190); }
      else if(pick==="gp"){ const w = clamp(randRange(GRID*1.0, Math.min(C.Rmax- C.react - 20, GRID*3.5)), GRID*1.0, GRID*3.5);
                            ents.gaps.push({x, w}); x += w + clamp(randRange(C.recover*0.7, C.recover*1.0), 90, 160); }
      else if(pick==="pf"){ ents.plats.push({x, y:FLOOR_Y - GRID*2 - clamp(randRange(GRID*1.0, Math.min(C.Hmax*0.7, GRID*2.5)), GRID*1.0, GRID*2.5), w:GRID*choice([2,3])});
                            x += clamp(randRange(C.recover*0.8, C.recover*1.2), 90, 170); }
      else { x += clamp(randRange(70, 140), 70, 160); }
      if(rand()<0.20) ents.stars.push({x:x-14, y:FLOOR_Y - GRID*2.6});
    }
  }

  nextGenAt = endX - (cvs.width/dpr)*0.25; // کمی قبلِ انتهای چانک بعدی بسازیم
}

/* ===== RNG, utils ===== */
let seed=(Date.now()>>>0)&0x7fffffff;
function rand(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return (seed>>>8)/0x7fffff; }
function choice(a){ return a[(rand()*a.length)|0]; }
function randRange(a,b){ return a + rand()*(b-a); }
function randInt(a,b){ return (a + Math.floor(rand()*(b-a+1))); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* ===== Loop ===== */
function frame(now){
  const dt=(now-last)/1000; last=now;
  if(!paused){
    acc += dt; if(acc>0.25) acc=0.25;
    while(acc >= PHYS_DT){ tick(PHYS_DT); acc -= PHYS_DT; }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===== Tick ===== */
function tick(dt){
  tAll += dt;

  // Adaptive difficulty: مرگ‌های اخیر => کاهش نرم سرعت و فضا بیشتر
  const adapt = clamp(1 - deaths*0.08 + streak*0.02, 0.75, 1.15);

  // speed ramp (clamped)
  speed = clamp(BASE_SPEED*adapt + (tAll*60)*SPEED_RAMP*(MAX_SPEED-BASE_SPEED), BASE_SPEED*0.9, MAX_SPEED);

  // scroll
  scrollX += speed*dt;
  spdEl.textContent = (speed/BASE_SPEED).toFixed(2)+"×";

  // gravity & player
  player.vy += g*dt;
  player.y += player.vy*dt;

  // ground
  if(player.y >= FLOOR_Y - CAT.h){
    player.y = FLOOR_Y - CAT.h;
    if(!player.grounded){
      // lock rotation to 90 deg multiples
      player.ang = Math.round(player.ang/(Math.PI/2))*(Math.PI/2);
    }
    player.vy=0; player.grounded=true; player.coyoteMs=120;
  } else { player.grounded=false; }

  // buffers
  if(player.coyoteMs>0) player.coyoteMs -= dt*1000;
  if(player.bufMs>0)     player.bufMs   -= dt*1000;

  if((player.bufMs>0) && (player.grounded || player.coyoteMs>0)){
    player.vy = -v0;
    player.grounded=false; player.coyoteMs=0; player.bufMs=0; player.wantJump=false;
  }

  // rotation while airborne
  if(!player.grounded) player.ang += 9.42*dt;

  // ensure upcoming chunk
  if(scrollX > nextGenAt) genChunk();

  // collisions (with forgiveness)
  const px=player.x+FORGIVE_PX/2, py=player.y+FORGIVE_PX/2, pw=CAT.w-FORGIVE_PX, ph=CAT.h-FORGIVE_PX;

  // gaps: if player footprint fully over gap top line -> start falling earlier
  for(const gp of ents.gaps){
    const wx = gp.x - scrollX;
    if(wx < -200) continue;
    if(wx > cvs.width/dpr + 200) break;
    // اگر مرکز پایینی بازیکن وارد بازه‌ی گپ شود و ارتفاع از لبه کمتر باشد => سقوط
    const cx = px + pw/2;
    if(cx > wx && cx < wx + gp.w){
      // یعنی زیر پای کاراکتر هواتره
      // اجازه می‌دهیم اگر روی سکویی بالاست، سقوط نکند؛ در غیر این‌صورت جاذبه کار خود را می‌کند
    }
  }

  // spikes
  for(const sp of ents.spikes){
    const wx = sp.x - scrollX;
    if(wx < -120) continue;
    if(wx > cvs.width/dpr + 120) break;
    for(let i=0;i<sp.n;i++){
      const bx = wx + i*GRID + SPIKE_INSET/2;
      const by = FLOOR_Y - GRID + SPIKE_INSET/2;
      if(overlap(px,py,pw,ph, bx,by, GRID-SPIKE_INSET, GRID-SPIKE_INSET)){ die(); return; }
    }
  }

  // platforms (one-way from above)
  for(const pf of ents.plats){
    const wx = pf.x - scrollX;
    if(wx < -120) continue;
    if(wx > cvs.width/dpr + 120) break;
    if(player.vy >= 0 && overlap(px,py,pw,ph, wx, pf.y, pf.w, 8)){
      player.y = pf.y - CAT.h; player.vy=0; player.grounded=true;
    }
  }

  // saws (moving circle)
  for(const sw of ents.saws){
    sw.t += dt*1.4;
    const wx = sw.x - scrollX;
    if(wx < -160) continue;
    if(wx > cvs.width/dpr + 160) break;
    const cy = sw.y + Math.sin(sw.t)*sw.amp;
    const cx = wx, r = sw.r - 2; // forgiveness
    const nx = clamp(cx, px, px+pw);
    const ny = clamp(cy, py, py+ph);
    const dx=cx-nx, dy=cy-ny;
    if(dx*dx + dy*dy < r*r){ die(); return; }
  }

  // score
  score += speed*dt*0.05;
  scoreEl.textContent = Math.floor(score).toString();

  // cleanup
  const leftBound = -200;
  ents.spikes = ents.spikes.filter(e => e.x - scrollX > leftBound);
  ents.gaps   = ents.gaps.filter(e => e.x - scrollX > leftBound);
  ents.plats  = ents.plats.filter(e => e.x - scrollX > leftBound);
  ents.saws   = ents.saws.filter(e => e.x - scrollX > leftBound);

  if(score>best){ best=Math.floor(score); bestEl.textContent=best.toString(); }
}

/* ===== Render ===== */
function render(){
  ctx.clearRect(0,0,cvs.width,cvs.height);

  // gentle beat lines
  const beatPx = clamp(speed*(60/120), 70, 140);
  ctx.strokeStyle="#ffffff12"; ctx.lineWidth=1;
  for(let x= -((scrollX)%beatPx); x<cvs.width/dpr; x+=beatPx){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cvs.height/dpr); ctx.stroke();
  }

  // ground
  ctx.fillStyle=getVar("--ground");
  ctx.fillRect(0, FLOOR_Y+GRID, cvs.width/dpr, 6);

  // gaps (draw hints at edges)
  ctx.fillStyle="#394462";
  for(const gp of ents.gaps){
    const wx = gp.x - scrollX;
    if(wx<-200 || wx>cvs.width/dpr+200) continue;
    // نمایش لبه‌ها
    roundRect(wx-10, FLOOR_Y-GRID*2, 10, GRID*2, 4, true, false);
    roundRect(wx + gp.w, FLOOR_Y-GRID*2, 10, GRID*2, 4, true, false);
  }

  // platforms
  for(const pf of ents.plats){
    const wx = pf.x - scrollX; if(wx<-120 || wx>cvs.width/dpr+120) continue;
    ctx.fillStyle="#3b4766"; roundRect(wx, pf.y, pf.w, 8, 4, true, false);
  }

  // spikes
  for(const sp of ents.spikes){
    const wx = sp.x - scrollX; if(wx<-120 || wx>cvs.width/dpr+120) continue;
    for(let i=0;i<sp.n;i++) drawSpike(wx + i*GRID, FLOOR_Y-GRID, GRID);
  }

  // saws
  for(const sw of ents.saws){
    const wx = sw.x - scrollX; if(wx<-160 || wx>cvs.width/dpr+160) continue;
    const cy = sw.y + Math.sin(sw.t)*sw.amp;
    drawSaw(wx, cy, sw.r);
  }

  // stars
  for(let i=ents.stars.length-1;i>=0;i--){
    const st = ents.stars[i]; const wx = st.x - scrollX;
    if(wx<-80){ ents.stars.splice(i,1); continue; }
    if(wx>cvs.width/dpr+80) continue;
    drawStar(wx, st.y, 8);
    // collect
    const px=player.x, py=player.y, pw=CAT.w, ph=CAT.h;
    if(overlap(px,py,pw,ph, wx-8, st.y-8, 16,16)){
      score += 10; ents.stars.splice(i,1);
    }
  }

  // player
  drawCatRot(player.x, player.y, CAT.w, CAT.h, player.ang);
}

/* ===== Death / Restart ===== */
function die(){
  if(!player.alive) return;
  player.alive=false;
  deaths = Math.min(deaths+1, 6); streak = 0; // سختی تطبیقی
  setTimeout(restart, 160);
}
function restart(){
  scrollX=0; tAll=0; score=0;
  player.x=CAT.x; player.y=FLOOR_Y-CAT.h; player.vy=0; player.grounded=true; player.ang=0; player.bufMs=0; player.wantJump=false; player.alive=true;
  ents.spikes.length=0; ents.gaps.length=0; ents.plats.length=0; ents.saws.length=0; ents.stars.length=0;
  nextGenAt=200; genChunk();
  paused=false;
}

/* ===== Helpers ===== */
function overlap(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by; }
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  if(fill) ctx.fill();
  if(stroke) ctx.stroke();
}
function triangle(x1,y1,x2,y2,x3,y3,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.stroke(); }
}
function drawSpike(x,y,size){
  triangle(x+2,y+size-2, x+size/2,y+2, x+size-2,y+size-2, getVar("--warn"), "#c04b3d");
}
function drawSaw(x,y,r){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle=getVar("--saw"); ctx.strokeStyle="#7f8cff"; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<12;i++){
    const a=i*(Math.PI*2/12), R=r+6, r2=r-2;
    ctx.lineTo(Math.cos(a)*R, Math.sin(a)*R);
    ctx.lineTo(Math.cos(a+0.13)*r2, Math.sin(a+0.13)*r2);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#4f59a6"; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawStar(cx,cy,r){
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle="#ffd166"; ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=(i*72-90)*Math.PI/180, a2=a+36*Math.PI/180, r2=r*0.5;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.lineTo(Math.cos(a2)*r2, Math.sin(a2)*r2);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawCatRot(x,y,w,h,ang){
  ctx.save();
  ctx.translate(x+w/2, y+h/2);
  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(0,h/2, w*0.7, 6, 0,0,Math.PI*2); ctx.fill();
  ctx.rotate(ang);
  ctx.fillStyle=getVar("--cat"); ctx.strokeStyle=getVar("--cat2"); ctx.lineWidth=2;
  roundRect(-w/2,-h/2,w,h,6,true,true);
  ctx.fillStyle="#222"; ctx.beginPath(); ctx.arc(-6,-4,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 6,-4,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ===== Start ===== */
genChunk();

})();</script>
</body>
</html>
